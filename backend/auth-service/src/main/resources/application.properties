spring.applicatioin.name=auth-service

server.port=8081

# MySQL connection
spring.datasource.url=jdbc:mysql://localhost:3306/leaders_auth_db
spring.datasource.username=root
spring.datasource.password=LeadersRoot123!
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate configuration
spring.jpa.hibernate.ddl-auto=validate
